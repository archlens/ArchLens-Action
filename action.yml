name: 'archlens-action'
description: 'runs archlens rederDiff on pull-requests and outputs diagram as a comment on the PR'
inputs:
  github-token:
    description: 'GitHub token (needs pull-requests: write to comment)'
    required: true
  base-ref:
    description: 'Base commit'
    default: ${{ github.event.pull_request.base.sha }}
  head-ref:
    description: 'Head commit'
    default: ${{ github.event.pull_request.head.sha }}
  warm-cache:
    description: 'Only warm the parse cache (run this on pushes to your default branch). Nothing is posted.'
    default: 'false'
  ast-language-image:
    description: 'Sets the language of the ast-parser the project uses, this is done using a docker image with the language needed installed. The image needs git, curl and tar'
    default: ''
  package-install: 
    description: 'Installs extra missing packages to the image'
    default: ''
  preset:
    description: 'Select a preset ast-language container to use that is fully working. There is a container for all base supported ast-parsers in archlens (e.g. go, python, java)'
    default: ''
  edit-in-place:
    description: 'Update the existing ArchLens comment instead of posting a new one and deleting the old one'
    default: 'false'
  always-show-diff:
    description: 'Post the full diagram even when nothing changed. By default a short "no architecturally significant changes" comment is posted instead.'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Resolve refs
      id: refs
      shell: bash
      env:
        WARM: ${{ inputs.warm-cache }}
        BASE: ${{ inputs.base-ref }}
        HEAD: ${{ inputs.head-ref }}
      run: |
        if [ "$WARM" = "true" ]; then
          # Warm mode: the pushed commit and its first parent
          HEAD="${HEAD:-$GITHUB_SHA}"
          BASE=$(git rev-parse --verify --quiet "$HEAD~1" || echo "$HEAD")
        fi
        if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
          echo "::error::base-ref and head-ref are empty. Run on pull_request events, or pass them explicitly."
          exit 1
        fi
        echo "base=$BASE" >> "$GITHUB_OUTPUT"
        echo "head=$HEAD" >> "$GITHUB_OUTPUT"

    - name: Install Dagger CLI
      shell: bash
      run: |
        curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

    - name: Restore ArchLens cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: .archlens/diff-cache
        key: archlens-${{ steps.refs.outputs.head }}
        restore-keys: |
          archlens-

    # In warm mode an exact hit means this commit is already cached, so skip the work
    - name: Render diff
      if: inputs.warm-cache != 'true' || steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BASE_REF: ${{ steps.refs.outputs.base   }}
        HEAD_REF: ${{ steps.refs.outputs.head   }}
        IMAGE:    ${{ inputs.ast-language-image }}
        PACKAGES: ${{ inputs.package-install    }}
        PRESET:   ${{ inputs.preset             }}
      run: |
        dagger call -m "${{ github.action_path }}/.dagger" \
          --src="$GITHUB_WORKSPACE" \
          render-diff --base-ref="$BASE_REF" --head-ref="$HEAD_REF" \
          --preset="$PRESET" \
          --image="$IMAGE" \
          --packages="$PACKAGES" \
          export --path="$RUNNER_TEMP/out"

        # Dagger ran in a container, so copy the updated caches back to the
        # workspace where the save step can see them.
        mkdir -p .archlens/diff-cache
        cp -r "$RUNNER_TEMP/out/cache/." .archlens/diff-cache/

    - name: Save ArchLens cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .archlens/diff-cache
        key: archlens-${{ steps.refs.outputs.head }}

    - name: Comment on PR
      if: inputs.warm-cache != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EDIT_IN_PLACE: ${{ inputs.edit-in-place }}
        ALWAYS_SHOW_DIFF: ${{ inputs.always-show-diff }}
      run: |
        marker='<!-- archlens-diff -->'
        diff="$RUNNER_TEMP/out/diff.md"

        # A link label with a non-zero change, e.g. "3 (+1)" or "0 (-2)", means something changed
        if grep -Eq '\([+-]0*[1-9][0-9]*\)' "$diff"; then changed=true; else changed=false; fi

        if [ "$changed" = "false" ] && [ "$ALWAYS_SHOW_DIFF" != "true" ]; then
          printf '%s\n### ArchLens\nNo architecturally significant changes.\n' "$marker" > "$RUNNER_TEMP/comment.md"
        else
          { echo "$marker"; cat "$diff"; } > "$RUNNER_TEMP/comment.md"
        fi

        api="repos/$GITHUB_REPOSITORY"

        # Every existing ArchLens comment on this PR, oldest first
        ids=$(gh api --paginate "$api/issues/$PR_NUMBER/comments" \
          | jq -r --arg m "$marker" '.[] | select(.body | contains($m)) | .id')

        if [ "$EDIT_IN_PLACE" = "true" ] && [ -n "$ids" ]; then
          keep=$(printf '%s\n' "$ids" | tail -n1)
          gh api -X PATCH "$api/issues/comments/$keep" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
        else
          keep=$(gh api -X POST "$api/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/comment.md" --jq .id)
        fi

        # Either way, only one ArchLens comment stays: remove every other one
        for old in $ids; do
          [ "$old" = "$keep" ] || gh api -X DELETE "$api/issues/comments/$old"
        done

branding:
  icon: 'activity'
  color: 'purple'